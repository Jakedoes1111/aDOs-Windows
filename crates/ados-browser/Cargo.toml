[package]
name = "ados-browser"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
gpui-kit.workspace = true
ados-core = { path = "../ados-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
raw-window-handle = "0.6"
x11rb = { version = "0.13", features = ["composite", "shape", "xtest"] }
tungstenite = "0.28"
ureq = { version = "3", default-features = false, features = ["json"] }
async-channel = "2"
rustix = { version = "1", features = ["event", "process"] }
base64 = "0.22"
png = "0.18"

# Windows: pages are WebView2 (src/webview/). webview2-com 0.39 uses the same `windows` 0.62
# as GPUI and links the WebView2 loader statically: no DLL to ship.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
