name: Build

# Builds on main and on demand only (`gh workflow run windows.yml --ref <branch>`).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Modules ported so far. The Browser (WebView2) comes later: docs/design/windows-port.md.
      FEATURES: notes,terminal,assistant,palette,calendar,sessions,tasks,mcp
      # Static C runtime: ados.exe runs without the Visual C++ Redistributable.
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      EXE: target/x86_64-pc-windows-msvc/release/ados.exe
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p ados --release --no-default-features --features ${{ env.FEATURES }}
      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist/aDOs | Out-Null
          Copy-Item $env:EXE, docs/windows/README.txt dist/aDOs/
      - uses: actions/upload-artifact@v4
        with:
          name: aDOs-windows-x64
          path: dist/aDOs/
      - name: Start the app and take screenshots
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force smoke | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("smoke/$name.png")
          }
          # No ADOS_HOME: the default data folder is under test too.
          $app = Start-Process $env:EXE -PassThru
          Start-Sleep 15
          Shot "1-start"
          if ($app.HasExited) { throw "ados.exe stopped at start, exit code $($app.ExitCode)" }
          # A second launch on the same data folder must hand off to the first and exit 0.
          $second = Start-Process $env:EXE -PassThru
          if (-not $second.WaitForExit(10000)) { throw "the second launch did not exit" }
          if ($second.ExitCode -ne 0) { throw "the second launch exited with $($second.ExitCode)" }
          if ($app.HasExited) { throw "the first aDOs stopped during the second launch" }
          (New-Object -ComObject WScript.Shell).SendKeys("^k")
          Start-Sleep 3
          Shot "2-palette"
          (New-Object -ComObject WScript.Shell).SendKeys("{ESC}")
          # Terminal: the Research layout has one, so a shell runs under aDOs (ConPTY).
          $shells = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($app.Id)" | Where-Object { $_.Name -in "pwsh.exe", "powershell.exe" }
          if (-not $shells) { throw "no PowerShell under ados.exe: the Terminal did not start a shell" }
          "Terminal shell: $($shells.Name -join ', ')"
          (New-Object -ComObject WScript.Shell).SendKeys("^3")
          Start-Sleep 2
          (New-Object -ComObject WScript.Shell).SendKeys("echo ados-terminal-ok{ENTER}")
          Start-Sleep 3
          Shot "3-terminal"
          # MCP: the bridge finds the running aDOs through current.json and lists its tools.
          $run = "$env:LOCALAPPDATA\ados\run"
          if (-not (Test-Path "$run\current.json")) { throw "no MCP current.json in $run" }
          '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | Set-Content -Encoding ascii smoke/mcp-in.json
          $bridge = Start-Process $env:EXE -ArgumentList "mcp-bridge" -RedirectStandardInput smoke/mcp-in.json -RedirectStandardOutput smoke/mcp-out.json -RedirectStandardError smoke/mcp-err.txt -NoNewWindow -PassThru
          if (-not $bridge.WaitForExit(15000)) { $bridge.Kill(); throw "ados mcp-bridge did not finish" }
          $out = Get-Content -Raw smoke/mcp-out.json
          Get-Content -Raw smoke/mcp-err.txt
          if ($out -notmatch '"notes_list"') { throw "MCP tools/list did not answer: $out" }
          if ($out -match '"browser_open"') { throw "MCP lists browser tools in a build without the Browser" }
          "MCP tools/list answered ($($out.Length) bytes)"
          if (-not (Test-Path "$env:APPDATA\ados")) { throw "no data folder at %APPDATA%\ados" }
          Get-ChildItem "$env:APPDATA\ados" | Format-Table Name
          Stop-Process -Id $app.Id
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke/
      - name: Test the ported crates
        # One crate per cargo call: several crates have an example named `standalone`, and
        # building them together makes the linkers collide on one output file.
        run: |
          $failed = @()
          foreach ($p in "ados-core", "ados-agents", "ados-notes", "ados-tasks", "ados-calendar", "ados-palette", "ados-sessions", "ados-assistant", "ados-terminal", "ados-mcp --no-default-features") {
            $a = $p -split ' '
            cargo test --release --no-fail-fast -p @a
            if ($LASTEXITCODE -ne 0) { $failed += $p }
          }
          if ($failed) { throw "tests failed in: $($failed -join ', ')" }

  # Linux must keep building from the same tree.
  linux-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages (README, Ubuntu list)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libgbm-dev \
            libasound2-dev libssl-dev libdbus-1-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p ados
