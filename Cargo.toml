[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gpui-kit = "0.9.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Fast, small debug builds: no debug info, light optimisation.
[profile.dev]
opt-level = 1
debug = 0
strip = "debuginfo"

[profile.release]
opt-level = 3
debug = 0
codegen-units = 16
